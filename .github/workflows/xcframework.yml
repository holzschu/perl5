name: CI

on:
  pull_request:
    paths-ignore:
    - '**.md'
  workflow_dispatch:
  push:
    tags:
    - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Building xcframeworks
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Toolchain
      run: |
        xcodebuild -version
        df -h .

    - name: Build frameworks
      run: bash build_ios.sh

    - name: Audit archives and slices
      run: |
        bash ios/audit.sh .build | tee .build/audit.txt
        cat .build/checksums.txt >> "$GITHUB_STEP_SUMMARY"
        du -sh .build
        df -h .

    - uses: actions/upload-artifact@v7
      with:
        name: xcframeworks
        include-hidden-files: true
        if-no-files-found: error
        path: |
          .build/*.xcframework.zip
          .build/checksums.txt
          .build/audit.txt
          .build/release.md

  release:
    name: Publishing release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'holzschu/perl5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: xcframeworks
        path: dist

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Release $GITHUB_REF_NAME" --notes-file dist/release.md
        gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
          dist/*.xcframework.zip dist/checksums.txt
